name: EAS Build (APK)

# APK build for sideloading, QA, or sharing outside the Play Store. Runs
# alongside the AAB build (eas-build-submit.yml) on every push to master,
# and can also be triggered manually. Does not submit anywhere.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: eas build --platform android --profile apk --non-interactive
