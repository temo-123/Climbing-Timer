name: EAS Build & Submit (Play Store)

# Builds an Android App Bundle (AAB) with EAS and auto-submits it to the
# Play Store "internal" track on every push to master.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Write Play Store service account key
        run: echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-store-service-account.json
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

      - name: Build and submit AAB
        run: eas build --platform android --profile production --non-interactive --auto-submit

      - name: Clean up service account key
        if: always()
        run: rm -f play-store-service-account.json
