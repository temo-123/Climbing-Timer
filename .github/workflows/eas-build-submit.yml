name: EAS Build & Submit (Play Store)

# Builds an Android App Bundle (AAB) with EAS on every push to master.
# Auto-submit to the Play Store "internal" track is temporarily disabled —
# the app hasn't had its first manual AAB upload to Play Console yet, so
# automated submission isn't ready. Re-add PLAY_STORE_SERVICE_ACCOUNT_JSON
# steps and the --auto-submit flag below once that's done.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build AAB
        run: eas build --platform android --profile production --non-interactive
